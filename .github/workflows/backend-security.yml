name: Backend CI + Security

on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: ./docker/docker-compose.yml
      ENV_FILE: ./docker/.env
      GATEWAY_URL: http://localhost:9000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # Secret scanning (Gitleaks)
      # ----------------------------
      - name: Secret scan (gitleaks)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      # SAST (Snyk Code)
      # ----------------------------
      - name: Install Snyk CLI
        run: npm i -g snyk

      - name: Snyk Open Source (SCA)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk test --all-projects --severity-threshold=high

      # ----------------------------
      # Java build (produce jars)
      # ----------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend jars (skip tests)
        run: mvn -q -DskipTests package

      # ----------------------------
      # Prepare jars for docker-compose volumes
      # (compose is in ./docker so jars must be in docker/jars)
      # ----------------------------
      - name: Prepare jars for docker-compose volumes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/jars

          AUTH_JAR="$(ls -1 authentication/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"
          APP_JAR="$(ls -1 appointment/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"
          GW_JAR="$(ls -1 gateway/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"

          if [[ -z "${AUTH_JAR}" || -z "${APP_JAR}" || -z "${GW_JAR}" ]]; then
            echo "❌ Could not find one or more jars."
            echo "AUTH_JAR=${AUTH_JAR}"
            echo "APP_JAR=${APP_JAR}"
            echo "GW_JAR=${GW_JAR}"
            exit 1
          fi

          cp "${AUTH_JAR}" docker/jars/authentication.jar
          # compose volume expects ./jars/appointment.jar for appointment service
          cp "${APP_JAR}" docker/jars/appointment.jar
          cp "${GW_JAR}" docker/jars/gateway.jar

          echo "✅ jars prepared:"
          ls -lah docker/jars

      # ----------------------------
      # SCA (Snyk Open Source)
      # ----------------------------
      - name: Snyk Open Source (SCA)
        continue-on-error: true
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      # ----------------------------
      # IaC scan (Checkov)
      # ----------------------------
      - name: IaC scan (Checkov)
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./docker
          framework: dockerfile,yaml
          soft_fail: true

      # ----------------------------
      # Restore JWT private key
      # ----------------------------
      - name: Restore JWT private key (from GitHub Secret)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/secrets
          echo "${{ secrets.JWT_PRIVATE_KEY_B64 }}" | base64 -d > docker/secrets/jwt_private_key.pem
          chmod 600 docker/secrets/jwt_private_key.pem
          echo "✅ private key restored:"
          ls -lah docker/secrets

      # ----------------------------
      # Docker compose up
      # ----------------------------
      - name: Docker compose up
        id: compose_up
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d --build
          docker ps

      # ----------------------------
      # Wait for Gateway
      # 失败也不直接终止，并把结果写到 output
      # ----------------------------
      - name: Wait for Gateway health (with logs)
        id: wait_gateway
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for gateway health at ${GATEWAY_URL}/actuator/health ..."
          
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps || true
          echo "---- gateway port mapping ----"
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" port gateway 8080 || true
          
          GW_ID="$(docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" ps -q gateway || true)"
          echo "gateway container id: ${GW_ID}"
          
          for i in {1..120}; do
            # 打印容器状态（看是否在重启）
            if [[ -n "${GW_ID}" ]]; then
              echo "---- status attempt ${i} ----"
              docker inspect --format='Status={{.State.Status}} RestartCount={{.RestartCount}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${GW_ID}" || true
            fi
          
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" "${GATEWAY_URL}/actuator/health" || true)"
            if [[ "$code" == "200" ]]; then
              echo "✅ Gateway health OK"
              cat /tmp/health.json || true
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          
            echo "Attempt ${i}: HTTP ${code}"
            # 每 10 次输出一次 gateway 日志尾部（抓到崩溃原因）
            if (( i % 10 == 0 )); then
              echo "---- gateway logs (tail 200) ----"
              docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --no-color --tail=200 gateway || true
            fi
          
            sleep 2
          done
          
          echo "❌ Gateway not ready"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 1


      # ----------------------------
      # DAST - OWASP ZAP baseline
      # 仅当 gateway ready 才跑；ZAP 失败也不阻断
      # ----------------------------
      - name: DAST (OWASP ZAP baseline scan)
        if: steps.wait_gateway.outputs.ready == 'true'
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:9000"
          fail_action: false
          docker_user: root

      # ----------------------------
      # Always show logs at the end (useful)
      # ----------------------------
      - name: Show docker logs (always)
        if: always()
        shell: bash
        run: docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --no-color || true

      - name: Shutdown (always)
        if: always()
        shell: bash
        run: docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" down -v || true
