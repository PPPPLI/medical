name: Backend CI + Security

on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: ./docker/docker-compose.yml
      ENV_FILE: ./docker/.env
      GATEWAY_URL: http://localhost:9000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # SAST - Secret scanning
      # ----------------------------
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      # SAST - Snyk Code
      # ----------------------------
      - name: Snyk Code (SAST)
        uses: snyk/actions@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

      # ----------------------------
      # Java build (produce jars)
      # ----------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build backend jars (skip tests)
        run: mvn -q -DskipTests package

      - name: Prepare jars folder for docker-compose volumes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jars

          # ---- IMPORTANT ----
          # Adjust these module paths to match YOUR repo structure
          # (the folder that contains each module's pom.xml)
          #
          # Example candidates in your project:
          # Authentication-8083, Questionnaire-8082, Gateway-9090, etc.
          #
          # Replace the paths below accordingly:
          AUTH_JAR="$(ls -1 authentication/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"
          Q_JAR="$(ls -1 questionnaire/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"
          GW_JAR="$(ls -1 gateway/target/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -n 1 || true)"

          if [[ -z "${AUTH_JAR}" || -z "${Q_JAR}" || -z "${GW_JAR}" ]]; then
            echo "❌ Could not find one or more jars. Check module paths in this step."
            echo "AUTH_JAR=${AUTH_JAR}"
            echo "Q_JAR=${Q_JAR}"
            echo "GW_JAR=${GW_JAR}"
            echo "Workspace tree:"
            ls -lah
            exit 1
          fi

          cp "${AUTH_JAR}" jars/authentication.jar
          cp "${Q_JAR}" jars/questionnaire.jar
          cp "${GW_JAR}" jars/gateway.jar

          echo "✅ jars prepared:"
          ls -lah jars

      # ----------------------------
      # SCA - Snyk Open Source (deps)
      # ----------------------------
      - name: Snyk Open Source (SCA)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      # ----------------------------
      # IaC scanning - Checkov
      # ----------------------------
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,docker_compose
          soft_fail: true

      # ----------------------------
      # Restore JWT private key file
      # ----------------------------
      - name: Restore JWT private key (from GitHub Secret)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker/secrets
          echo "${{ secrets.JWT_PRIVATE_KEY_B64 }}" | base64 -d > docker/secrets/jwt_private_key.pem
          chmod 600 docker/secrets/jwt_private_key.pem
          echo "✅ private key restored at docker/secrets/jwt_private_key.pem"
          ls -lah docker/secrets

      # ----------------------------
      # Docker execution required
      # ----------------------------
      - name: Docker compose up
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "❌ Missing ${ENV_FILE}. Create it (recommended) or change ENV_FILE in workflow."
            exit 1
          fi

          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" up -d
          docker ps

      - name: Wait for Gateway
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for gateway at ${GATEWAY_URL} ..."

          # Try actuator health first, then fallback to root
          for i in {1..60}; do
            if curl -fsS "${GATEWAY_URL}/actuator/health" >/dev/null 2>&1; then
              echo "✅ Gateway actuator health OK"
              exit 0
            fi
            if curl -fsS "${GATEWAY_URL}/" >/dev/null 2>&1; then
              echo "✅ Gateway root OK"
              exit 0
            fi
            echo "Waiting... (${i}/60)"
            sleep 3
          done

          echo "❌ Gateway did not start in time"
          docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --no-color
          exit 1

      # ----------------------------
      # DAST - OWASP ZAP baseline
      # ----------------------------
      - name: DAST (OWASP ZAP baseline scan)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:9000"
          fail_action: false

      # ----------------------------
      # Logs & shutdown
      # ----------------------------
      - name: Dump logs on failure
        if: failure()
        shell: bash
        run: docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" logs --no-color

      - name: Shutdown
        if: always()
        shell: bash
        run: docker compose -f "${COMPOSE_FILE}" --env-file "${ENV_FILE}" down -v
