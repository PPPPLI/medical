name: survey-backend

services:
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "${CONSUL_HTTP_PORT}:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medical-net

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - medical-net

  # Spring Boot services (run from jars)
  authentication:
    image: eclipse-temurin:17-jre
    container_name: authentication
    volumes:
      - ./jars/authentication.jar:/app/app.jar:ro
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro

    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${AUTH_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PRIVATE_KEY:  "/run/secrets/jwt_private_key.pem"
      # Consul
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - medical-net

  appointment:
    image: eclipse-temurin:17-jre
    container_name: appointment
    volumes:
      - ./jars/questionnaire.jar:/app/app.jar:ro
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${QUESTIONNAIRE_PORT}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      PRIVATE_KEY: /run/secrets/jwt_private_key.pem
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500

    depends_on:
      consul:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - medical-net

  gateway:
    image: eclipse-temurin:17-jre
    container_name: gateway
    volumes:
      - ./jars/gateway.jar:/app/app.jar:ro
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro

    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      FRONTEND_ORIGIN: https://surveysmart.net/
    depends_on:
      consul:
        condition: service_healthy
      authentication:
        condition: service_started
      appointment:
        condition: service_started
    networks:
      - medical-net

volumes:
  consul_data:
  mysql_data:

networks:
  medical-net:
    driver: bridge
